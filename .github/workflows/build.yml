name: Build Windmill Addon
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from config.yaml
        id: version
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          V=$(yq '.version' config.yaml)
          echo "v=$V" >> $GITHUB_OUTPUT
          echo "Extracted version: $V"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/wickm/windmill-hassio-addon:latest
            ghcr.io/wickm/windmill-hassio-addon:${{ steps.version.outputs.v }}
            ghcr.io/wickm/windmill-hassio-addon:v${{ steps.version.outputs.v }}
